<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Página de login</title>
</head>
<body>

    <form id="formulario" novalidate>
        <div class="titulo">
            <h1>Faça o seu login</h1>
            <div class="barra-horizontal">
        </div>
        </div>


        <div class="campo-input">
            <label for="email" >Seu e-mail* </label>
            <input type="text" id="email" placeholder="exemple@gmail.com" >
            <p id="mensagem-email"></p>

        </div>

        <div class="campo-input">
            <label for="password" >Sua senha* </label>
            <input maxlength="10" type="password" id="senha" placeholder="exemple1234" >
            <p id="mensagem-senha"></p>
        </div>
        <div class="lembrar-me">
            <input class="checkbox" type="checkbox">
            <p>Lembre-me </p>
        </div>
        <div id="mensagem"></div>
        <div class="butao">
        <button  type="submit">Entrar</button>
        <button  onclick="window.location.href='cadastrar_usuario.html'" type="button" >cadastre-se</button>
        </div>
    
        <div class="esqueceu-senha">
            <p>Esqueceu sua senha ? <a href="/sistema de login/recuperar_senha.html">Clique aqui</a></p>
        </div>

        
    </form>

</body>
<script src="tela_login.js">
    
</script>

</html>
